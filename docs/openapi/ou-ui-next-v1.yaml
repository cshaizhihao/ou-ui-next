    AgentCommandEnvelope:
      type: object
      required:
        - type
        - commandId
        - taskId
        - agentId
        - seq
        - requestId
        - issuedAt
        - deadlineAt
        - payload
      properties:
        type:
          $ref: '#/components/schemas/AgentCommandType'
        commandId:
          $ref: '#/components/schemas/CommandId'
        taskId:
          $ref: '#/components/schemas/TaskId'
        agentId:
          $ref: '#/components/schemas/AgentId'
        sessionId:
          $ref: '#/components/schemas/SessionId'
        seq:
          type: integer
          minimum: 0
