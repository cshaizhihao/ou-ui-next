          $ref: '#/components/schemas/RequestId'
        issuedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        payload:
          oneOf:
            - $ref: '#/components/schemas/ApplyCommandPayload'
            - $ref: '#/components/schemas/RollbackCommandPayload'
            - $ref: '#/components/schemas/ReloadCommandPayload'
            - $ref: '#/components/schemas/HealthCommandPayload'
            - $ref: '#/components/schemas/TelemetryCommandPayload'
      additionalProperties: false
    ApplyCommandPayload:
      type: object
      required:
        - configRevision
        - moduleKind
        - checksum
      properties:
        configRevision:
          type: string
        moduleKind:
          $ref: '#/components/schemas/RuntimeModuleKind'
        artifactUri:
          type: string
        checksum:
          type: string
          pattern: '^sha256:[a-fA-F0-9]{64}$'
        signature:
          type: string
        preflightPlanId:
          type: string
        snapshotBeforeId:
          type: string
        applyMode:
          type: string
          enum:
            - hot_reload
            - graceful_restart
            - staged_only
        dryRun:
          type: boolean
        rollbackTaskId:
          type: string
          nullable: true
      additionalProperties: false
    RollbackCommandPayload:
      type: object
      required:
        - snapshotId
        - targetConfigRevision
        - rollbackReason
        - rollbackMode
      properties:
        snapshotId:
          type: string
        targetConfigRevision:
          type: string
        rollbackReason:
          type: string
        rollbackMode:
          type: string
          enum:
            - hot_reload
            - graceful_restart
      additionalProperties: false
    ReloadCommandPayload:
      type: object
      required:
        - moduleKind
        - moduleId
        - configRevision
        - reloadMode
      properties:
        moduleKind:
          $ref: '#/components/schemas/RuntimeModuleKind'
        moduleId:
          type: string
        configRevision:
          type: string
        reloadMode:
          type: string
          enum:
            - hot_reload
            - graceful_restart
            - staged_only
      additionalProperties: false
    HealthCommandPayload:
      type: object
      properties:
        checks:
          type: array
          items:
            type: string
            enum:
              - process
              - port_bind
              - config_version
              - module_api
              - traffic_counter
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 120000
      additionalProperties: false
    TelemetryCommandPayload:
      type: object
      properties:
        intervalSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        includeRuntimeCounters:
          type: boolean
        includeFlowSamples:
          type: boolean
        scope:
          type: string
      additionalProperties: false
    AgentEventEnvelope:
      type: object
      required:
        - type
        - eventId
        - agentId
        - seq
        - sessionId
        - observedAt
        - payload
      properties:
        type:
          $ref: '#/components/schemas/AgentEventType'
        eventId:
          type: string
        commandId:
          $ref: '#/components/schemas/CommandId'
        taskId:
          $ref: '#/components/schemas/TaskId'
