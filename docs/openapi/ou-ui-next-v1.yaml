  /events/v1/tasks:
    get:
      tags:
        - TaskEvents
      operationId: streamTaskEvents
      summary: Stream task and audit summaries through SSE
      description: Sends a cursor-resumable snapshot of matching task-status history and audit summary events, then keeps the connection open while tailing durable task/audit read models for follow-up events. Task-status events replay the persisted audit-backed status chain instead of only the latest task row. Use `cursor` or the standard `Last-Event-ID` header to skip events that were already consumed. Use `once=1` for a bounded diagnostic snapshot.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Last consumed SSE event id. When present, the initial snapshot starts after this event. Takes precedence over `Last-Event-ID`.
          schema:
            type: string
            minLength: 1
        - name: Last-Event-ID
          in: header
          required: false
          description: Standard SSE reconnect cursor used when the `cursor` query parameter is not supplied.
          schema:
            type: string
            minLength: 1
        - name: taskId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskId'
        - name: once
          in: query
          required: false
          description: Set to `1` to close the stream after the initial snapshot and `stream.ready` event.
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: Server-sent task event stream.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                taskStatusChanged:
                  value: |
                    event: task.status.changed
                    id: task:task-0001:2026-06-02T00:00:05.000Z#audit-task-0001-running
                    data: {"taskId":"task-0001","status":"running","occurredAt":"2026-06-02T00:00:05.000Z"}
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /events/v1/system-alerts:
    get:
      tags:
        - TaskEvents
      operationId: streamSystemAlertEvents
      summary: Stream active system alert snapshots through SSE
      description: Sends a cursor-resumable snapshot of active system alerts, then keeps the connection open and emits a new snapshot whenever the durable derived alert state changes, including updates written by sibling sqlite-backed panel instances. Use `cursor` or the standard `Last-Event-ID` header to skip an already consumed snapshot. Use `once=1` for a bounded diagnostic snapshot.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Last consumed system alert SSE event id. Takes precedence over `Last-Event-ID`.
          schema:
            type: string
            minLength: 1
        - name: Last-Event-ID
          in: header
          required: false
          description: Standard SSE reconnect cursor used when the `cursor` query parameter is not supplied.
          schema:
            type: string
            minLength: 1
        - name: severity
          in: query
          required: false
          description: Limit snapshots to one alert severity.
          schema:
            type: string
            enum:
              - warning
              - critical
        - name: resourceId
          in: query
          required: false
          description: Limit snapshots to alerts for one resource id.
          schema:
            type: string
            minLength: 1
        - name: once
          in: query
          required: false
          description: Set to `1` to close the stream after the initial snapshot and `stream.ready` event.
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: Server-sent system alert snapshot stream.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                systemAlertSnapshot:
                  value: |
                    event: system_alert.snapshot
                    id: system-alerts:abc123
                    data: {"count":1,"criticalCount":0,"warningCount":1,"alerts":[{"id":"alert-agent-telemetry-sampling-gap-agent-edge-01","kind":"agent.telemetry_sampling_gap","severity":"warning"}],"generatedAt":"2026-06-05T00:00:00.000Z"}
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Globally unique mutation request identifier.
      schema:
        $ref: '#/components/schemas/RequestId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional idempotency key for safe mutation retries.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Server-issued CSRF token required when an operator mutation is authenticated by the HttpOnly session cookie. Not required for valid bearer-token automation without a session cookie or Agent runtime routes.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected resource version for optimistic concurrency checks.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Actor:
      name: X-Actor
      in: header
      required: true
      description: Authenticated operator identity.
      schema:
        type: string
        minLength: 1
    OperatorGroupId:
      name: X-Operator-Group-Id
      in: header
      required: false
      description: Operator group used for RBAC evaluation.
      schema:
        type: string
        minLength: 1
    ResourceGroupId:
      name: X-Resource-Group-Id
      in: header
      required: false
      description: Target resource group for authorization and audit scoping.
      schema:
        type: string
        minLength: 1
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TaskId'
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AgentId'
  responses:
    ErrorResponse:
      description: Control-plane error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ResponseEnvelope:
      type: object
      required:
        - data
        - requestId
      properties:
        data: {}
        requestId:
          $ref: '#/components/schemas/RequestId'
        taskId:
          $ref: '#/components/schemas/TaskId'
        warnings:
          type: array
          items:
            type: string
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
        - error
        - requestId
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              examples:
                - permission.denied
                - agent_result.required
                - task.invalid_transition
                - idempotency.conflict
                - operator_auth.rate_limited
                - csrf.required
            message:
              type: string
            details: {}
          additionalProperties: false
        requestId:
          $ref: '#/components/schemas/RequestId'
      additionalProperties: false
    OperatorSession:
      type: object
      required:
        - authenticated
        - sessionId
        - username
        - actor
        - expiresAt
        - csrfToken
      properties:
        authenticated:
          type: boolean
          enum:
            - true
        sessionId:
          $ref: '#/components/schemas/SessionId'
        username:
          type: string
          minLength: 1
          maxLength: 160
        actor:
          type: string
          minLength: 1
          maxLength: 160
        operatorGroupId:
          type: string
          minLength: 1
          maxLength: 160
        resourceGroupId:
          type: string
          minLength: 1
          maxLength: 160
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    OperatorSessionSummary:
      type: object
      required:
        - id
        - username
        - actor
        - status
        - issuedAt
        - expiresAt
        - sourceIp
        - requestId
      properties:
        id:
          $ref: '#/components/schemas/SessionId'
        username:
          type: string
          minLength: 1
          maxLength: 160
        actor:
          type: string
          minLength: 1
          maxLength: 160
        operatorGroupId:
          type: string
          minLength: 1
          maxLength: 160
        resourceGroupId:
          type: string
          minLength: 1
          maxLength: 160
        status:
          type: string
          enum:
            - active
            - revoked
            - expired
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        sourceIp:
          type: string
          minLength: 1
          maxLength: 200
        userAgent:
          type: string
          minLength: 1
          maxLength: 1000
        requestId:
          $ref: '#/components/schemas/RequestId'
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          type: string
          minLength: 1
          maxLength: 160
        revokedReason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
