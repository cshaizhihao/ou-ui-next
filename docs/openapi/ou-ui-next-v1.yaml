openapi: 3.1.0
info:
  title: OU-UI Next Control Plane API
  version: 1.0.0
  description: Machine-readable V1 contract for OU-UI Next task orchestration, command outbox dispatch, Universal Agent events, task event streaming, system alert streaming, operator authentication failure throttling, and session-backed CSRF protection.
servers:
  - url: /
    description: Same-origin control-plane deployment.
tags:
  - name: ControlPlane
  - name: Inventory
  - name: Tasks
  - name: Audit
  - name: AgentCommands
  - name: AgentRuntime
  - name: Subscriptions
  - name: Telemetry
  - name: RuntimeReleases
  - name: TaskEvents
paths:
  /api/v1/boundary:
    get:
      tags:
        - ControlPlane
      operationId: getApiBoundary
      summary: Get the V1 API boundary descriptor
      responses:
        '200':
          description: Control-plane transport and task transition capabilities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/ApiBoundaryDescriptor'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/session:
    post:
      tags:
        - ControlPlane
      operationId: createOperatorSession
      summary: Create an operator session cookie
      description: Validates operator login credentials on the server, sets an HttpOnly session cookie, and returns the CSRF token required by session-backed operator mutations. Passwords and operator bearer tokens are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 160
                password:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '201':
          description: Operator session created.
          headers:
            Set-Cookie:
              description: HttpOnly operator session cookie scoped to the panel origin.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OperatorSession'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags:
        - ControlPlane
      operationId: getOperatorSession
      summary: Verify the current operator session cookie
      description: Returns the current operator session summary and the CSRF token required by session-backed operator mutations.
      responses:
        '200':
          description: Current operator session summary.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OperatorSession'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - ControlPlane
      operationId: deleteOperatorSession
      summary: Clear the operator session cookie
      responses:
        '200':
          description: Operator session cookie cleared in the browser.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - authenticated
                        properties:
                          authenticated:
                            type: boolean
                            enum:
                              - false
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/snapshot:
    get:
      tags:
        - ControlPlane
      operationId: getControlPlaneSnapshot
      summary: Get the dashboard inventory snapshot
      responses:
        '200':
          description: Full read model snapshot consumed by the OU-UI Next dashboard.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/ControlPlaneSnapshot'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/observability-metrics:
    get:
      tags:
        - Telemetry
      operationId: getObservabilityMetrics
      summary: Get operator observability metrics
      description: Returns an operator-facing metrics snapshot derived from tasks, command outbox, Agent liveness, active system alerts, and audit-chain verification.
      responses:
        '200':
          description: Observability metrics snapshot.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/ObservabilityMetrics'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /metrics:
    get:
      tags:
        - Telemetry
      operationId: getPrometheusMetrics
      summary: Get Prometheus metrics
      description: Returns the current operator observability snapshot rendered as Prometheus text exposition. The route is protected by the operator bearer-token boundary when authentication is configured.
      responses:
        '200':
          description: Prometheus text metrics.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents:
    get:
      tags:
        - Inventory
      operationId: listAgents
      summary: List Universal Agent inventory
      responses:
        '200':
          description: Universal Agent read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentReadModel'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/customers:
    get:
      tags:
        - Inventory
      operationId: listCustomers
      summary: List decoupled customer inventory
      description: Derives customers from current customer nodes, subscription identities, and port-forwarding owners without requiring fake seed customers.
      responses:
        '200':
          description: Customer directory read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerReadModel'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/system-alerts:
    get:
      tags:
        - Telemetry
      operationId: listSystemAlerts
      summary: List active system alerts
      description: Returns operator-visible alerts derived from current read models, including Agent telemetry sampling gaps.
      responses:
        '200':
          description: Active system alert read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SystemAlert'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/install-command:
    post:
      tags:
        - AgentCommands
      operationId: createAgentInstallCommand
      summary: Generate a one-command Universal Agent installer
      description: The generated command contains a short-lived one-time install token. Replayed Idempotency-Key requests are rejected with 409 instead of returning or storing raw token material.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInstallCommandRequest'
      responses:
        '201':
          description: Short-lived Agent install command.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentInstallCommand'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agent-credentials:
    get:
      tags:
        - AgentCommands
      operationId: listAgentCredentials
      summary: List sanitized Agent credential records
      responses:
        '200':
          description: Agent install/runtime credential summaries without raw token material.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentCredentialSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agent-credentials/{credentialId}/revoke:
    post:
      tags:
        - AgentCommands
      operationId: revokeAgentCredential
      summary: Revoke an Agent install or runtime credential
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCredentialRevokeRequest'
      responses:
        '202':
          description: Credential revoked and audit ledger updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentCredentialSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agent-credentials/{credentialId}/rotate:
    post:
      tags:
        - AgentCommands
      operationId: rotateAgentCredential
      summary: Rotate an active Agent runtime credential
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCredentialRotateRequest'
      responses:
        '201':
          description: New runtime credential issued and the previous credential revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentRuntimeCredential'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/operator-sessions:
    get:
      tags:
        - ControlPlane
      operationId: listOperatorSessions
      summary: List server-recorded operator sessions
      responses:
        '200':
          description: Active, revoked, and expired operator session summaries without token material.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OperatorSessionSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/operator-sessions/{sessionId}/revoke:
    post:
      tags:
        - ControlPlane
      operationId: revokeOperatorSession
      summary: Revoke a server-recorded operator session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SessionId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorSessionRevokeRequest'
      responses:
        '202':
          description: Operator session revoked and future cookie-backed requests denied.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OperatorSessionSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/nodes:
    get:
      tags:
        - Inventory
      operationId: listNodes
      summary: List managed node inventory
      responses:
        '200':
          description: Managed node read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResourceSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/inbounds:
    get:
      tags:
        - Inventory
      operationId: listInbounds
      summary: List Xray inbound inventory
      responses:
        '200':
          description: Xray inbound read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResourceSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/subscription-sources:
    get:
      tags:
        - Inventory
      operationId: listSubscriptionSources
      summary: List subscription import sources
      responses:
        '200':
          description: Subscription source read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionSource'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/subscription-sources/{sourceId}/sync:
    post:
      tags:
        - Subscriptions
      operationId: syncSubscriptionSource
      summary: Fetch and sync an external subscription source
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      responses:
        '202':
          description: External source fetched, parsed, filtered, and stored as subscription inventory nodes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionSourceSyncResult'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/subscription-nodes:
    get:
      tags:
        - Inventory
      operationId: listSubscriptionInventoryNodes
      summary: List parsed external subscription nodes
      responses:
        '200':
          description: Parsed node inventory from synced external subscription sources.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionInventoryNode'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/subscription-bundles:
    get:
      tags:
        - Inventory
      operationId: listSubscriptionBundles
      summary: List generated subscription bundles
      responses:
        '200':
          description: Subscription bundle read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResourceSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/subscription-clients:
    get:
      tags:
        - Inventory
      operationId: listSubscriptionClients
      summary: List subscription client rule identities
      responses:
        '200':
          description: Subscription client rule read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResourceSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/subscription-export-profiles:
    get:
      tags:
        - Inventory
      operationId: listSubscriptionExportProfiles
      summary: List persisted subscription export profiles
      responses:
        '200':
          description: Persisted export profiles used to render Clash, Mihomo, sing-box, Surge, and URI subscription outputs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionExportProfile'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/proxy-providers:
    get:
      tags:
        - Inventory
      operationId: listProxyProviders
      summary: List subscription proxy provider read models
      responses:
        '200':
          description: Proxy provider read model generated by the control plane from persisted subscription sources.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProxyProviderConfig'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/subscription-export-files:
    get:
      tags:
        - Inventory
      operationId: listSubscriptionExportFiles
      summary: List subscription export file read models
      responses:
        '200':
          description: Export file read model generated by the control plane from persisted subscription client rules.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionExportFile'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /sub/{securePath}/{format}/{subId}:
    get:
      tags:
        - Subscriptions
      operationId: getPublicSubscriptionOutput
      summary: Download a generated client subscription by secure path and subId
      description: Public subscription clients such as Clash, Mihomo, sing-box, and v2rayN call this endpoint without operator bearer authentication. Access is scoped by the generated secure path and the client subId.
      parameters:
        - name: securePath
          in: path
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum:
              - uri
              - v2ray
              - clash
              - mihomo
              - sing-box
        - name: subId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Generated subscription output.
          headers:
            subscription-userinfo:
              description: Clash-compatible traffic header with upload, download, total, and expire counters.
              schema:
                type: string
            profile-update-interval:
              description: Suggested client refresh interval in hours.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
            text/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/forward-rules:
    get:
      tags:
        - Inventory
      operationId: listForwardRules
      summary: List forwarding rules
      responses:
        '200':
          description: Forward rule read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ForwardRule'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/quota-policies:
    get:
      tags:
        - Inventory
      operationId: listQuotaPolicies
      summary: List quota policies
      responses:
        '200':
          description: Quota policy read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/QuotaPolicy'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/quota-policies/{quotaPolicyId}/reset:
    post:
      tags:
        - Tasks
      operationId: resetQuotaPolicy
      summary: Reset a quota policy and create an audited quota.reset task
      parameters:
        - name: quotaPolicyId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      responses:
        '202':
          description: Quota reset task accepted; read-model baselines and audit snapshots are updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                      - taskId
                    properties:
                      taskId:
                        $ref: '#/components/schemas/TaskId'
                      data:
                        $ref: '#/components/schemas/DeployTask'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/rate-limit-policies:
    get:
      tags:
        - Inventory
      operationId: listRateLimitPolicies
      summary: List rate limit policies
      responses:
        '200':
          description: Rate limit read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResourceSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/permission-grants:
    get:
      tags:
        - Inventory
      operationId: listPermissionGrants
      summary: List RBAC permission grants
      responses:
        '200':
          description: Permission grant read model.
          content:
            application/json:
              schema:
                allOf:
