          type: integer
          minimum: 0
        sessionId:
          $ref: '#/components/schemas/SessionId'
        observedAt:
          type: string
          format: date-time
        payload:
          oneOf:
            - $ref: '#/components/schemas/AckEventPayload'
            - $ref: '#/components/schemas/HeartbeatEventPayload'
            - $ref: '#/components/schemas/ResultEventPayload'
            - $ref: '#/components/schemas/LogChunkEventPayload'
            - $ref: '#/components/schemas/TelemetrySampleEventPayload'
