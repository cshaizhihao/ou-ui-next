openapi: 3.1.0
info:
  title: OU-UI Next Control Plane API
  version: 1.0.0
  description: Machine-readable V1 contract for OU-UI Next task orchestration, command outbox dispatch, Universal Agent events, task event streaming, system alert streaming, operator authentication failure throttling, and session-backed CSRF protection.
servers:
  - url: /
    description: Same-origin control-plane deployment.
tags:
  - name: ControlPlane
  - name: Inventory
  - name: Tasks
  - name: Audit
  - name: AgentCommands
  - name: AgentRuntime
  - name: Subscriptions
  - name: Telemetry
  - name: RuntimeReleases
  - name: TaskEvents
  - name: Telegram
paths:
  /api/v1/boundary:
    get:
      tags:
        - ControlPlane
      operationId: getApiBoundary
      summary: Get the V1 API boundary descriptor
      responses:
        '200':
          description: Control-plane transport and task transition capabilities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/ApiBoundaryDescriptor'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/session:
    post:
      tags:
        - ControlPlane
      operationId: createOperatorSession
      summary: Create an operator session cookie
      description: Validates operator login credentials on the server, sets an HttpOnly session cookie, and returns the CSRF token required by session-backed operator mutations. Passwords and operator bearer tokens are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 160
                password:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '201':
          description: Operator session created.
          headers:
            Set-Cookie:
              description: HttpOnly operator session cookie scoped to the panel origin.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OperatorSession'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags:
        - ControlPlane
      operationId: getOperatorSession
      summary: Verify the current operator session cookie
      description: Returns the current operator session summary and the CSRF token required by session-backed operator mutations.
      responses:
        '200':
          description: Current operator session summary.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OperatorSession'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - ControlPlane
      operationId: deleteOperatorSession
      summary: Clear the operator session cookie
      responses:
        '200':
          description: Operator session cookie cleared in the browser.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - authenticated
                        properties:
                          authenticated:
                            type: boolean
                            enum:
                              - false
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/snapshot:
    get:
      tags:
        - ControlPlane
      operationId: getControlPlaneSnapshot
      summary: Get the dashboard inventory snapshot
      responses:
        '200':
          description: Full read model snapshot consumed by the OU-UI Next dashboard.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/ControlPlaneSnapshot'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/observability-metrics:
    get:
      tags:
        - Telemetry
      operationId: getObservabilityMetrics
      summary: Get operator observability metrics
      description: Returns an operator-facing metrics snapshot derived from tasks, command outbox, Agent liveness, active system alerts, and audit-chain verification.
      responses:
        '200':
          description: Observability metrics snapshot.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/ObservabilityMetrics'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /metrics:
    get:
      tags:
        - Telemetry
      operationId: getPrometheusMetrics
      summary: Get Prometheus metrics
      description: Returns the current operator observability snapshot rendered as Prometheus text exposition. The route is protected by the operator bearer-token boundary when authentication is configured.
      responses:
        '200':
          description: Prometheus text metrics.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents:
    get:
      tags:
        - Inventory
      operationId: listAgents
      summary: List Universal Agent inventory
      responses:
        '200':
          description: Universal Agent read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentReadModel'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/customers:
    get:
      tags:
        - Inventory
      operationId: listCustomers
      summary: List decoupled customer inventory
      description: Derives customers from current customer nodes, subscription identities, and port-forwarding owners without requiring fake seed customers.
      responses:
        '200':
          description: Customer directory read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerReadModel'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/system-alerts:
    get:
      tags:
        - Telemetry
      operationId: listSystemAlerts
      summary: List active system alerts
      description: Returns operator-visible alerts derived from current read models, including Agent telemetry sampling gaps.
      responses:
        '200':
          description: Active system alert read model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SystemAlert'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/install-command:
    post:
      tags:
        - AgentCommands
      operationId: createAgentInstallCommand
      summary: Generate a one-command Universal Agent installer
      description: The generated command contains a short-lived one-time install token. Replayed Idempotency-Key requests are rejected with 409 instead of returning or storing raw token material.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInstallCommandRequest'
      responses:
        '201':
          description: Short-lived Agent install command.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentInstallCommand'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agent-credentials:
    get:
      tags:
        - AgentCommands
      operationId: listAgentCredentials
      summary: List sanitized Agent credential records
      responses:
        '200':
          description: Agent install/runtime credential summaries without raw token material.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentCredentialSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agent-sessions:
    get:
      tags:
        - AgentRuntime
      operationId: listAgentSessions
      summary: List Agent session liveness and command progress
      responses:
        '200':
          description: Agent session progress summaries without credential token material.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentSessionSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agent-credentials/{credentialId}/revoke:
    post:
      tags:
        - AgentCommands
      operationId: revokeAgentCredential
      summary: Revoke an Agent install or runtime credential
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCredentialRevokeRequest'
      responses:
        '202':
          description: Credential revoked and audit ledger updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentCredentialSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agent-credentials/{credentialId}/rotate:
    post:
      tags:
        - AgentCommands
      operationId: rotateAgentCredential
      summary: Rotate an active Agent runtime credential
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCredentialRotateRequest'
      responses:
        '201':
          description: New runtime credential issued and the previous credential revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentRuntimeCredential'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/operator-sessions:
    get:
      tags:
        - ControlPlane
      operationId: listOperatorSessions
      summary: List server-recorded operator sessions
      responses:
        '200':
          description: Active, revoked, and expired operator session summaries without token material.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OperatorSessionSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/operator-sessions/{sessionId}/revoke:
    post:
      tags:
        - ControlPlane
      operationId: revokeOperatorSession
      summary: Revoke a server-recorded operator session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SessionId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorSessionRevokeRequest'
      responses:
        '202':
          description: Operator session revoked and future cookie-backed requests denied.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OperatorSessionSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/integrations/telegram-bot/settings:
    get:
      tags:
        - Telegram
      operationId: getTelegramBotSettings
      summary: Get Telegram Bot settings
      description: Returns sanitized Telegram Bot settings. Bot token, webhook secret, proxy URL, and credential hashes are never returned.
      responses:
        '200':
          description: Sanitized Telegram Bot settings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramBotSettings'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags:
        - Telegram
      operationId: updateTelegramBotSettings
      summary: Update Telegram Bot settings
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramBotSettingsUpdateRequest'
      responses:
        '200':
          description: Telegram Bot settings updated and audited.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramBotSettings'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/integrations/telegram-bot/test:
    post:
      tags:
        - Telegram
      operationId: testTelegramBotNotification
      summary: Send a Telegram test notification
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramTestNotificationRequest'
      responses:
        '202':
          description: Test delivery accepted, attempted, or suppressed according to current settings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramNotificationDelivery'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/integrations/telegram-bot/poll:
    post:
      tags:
        - Telegram
      operationId: pollTelegramBotUpdates
      summary: Manually poll Telegram Bot updates
      description: Uses the configured long-polling offset and advances it durably when updates are fetched. This route is an operator mutation and is separate from the background polling job.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      responses:
        '202':
          description: Long-polling attempt result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramLongPollingResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /telegram/webhook/{secret}:
    post:
      tags:
        - Telegram
      operationId: handleTelegramWebhookUpdate
      summary: Handle a public Telegram webhook update
      description: Public Telegram ingress authenticated by the unguessable webhook secret path. Operator session CSRF is not required for this route.
      parameters:
        - name: secret
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 500
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWebhookUpdate'
      responses:
        '200':
          description: Telegram update accepted, ignored, or rejected by command policy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramWebhookHandleResult'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/telegram-bindings:
    get:
      tags:
        - Telegram
      operationId: listTelegramBindings
      summary: List Telegram customer bindings
      responses:
        '200':
          description: Telegram customer binding read models.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TelegramBindingReadModel'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - Telegram
      operationId: createTelegramBinding
      summary: Create an operator-managed Telegram customer binding
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramBindingCreateRequest'
      responses:
        '201':
          description: Telegram binding created and audited.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramBindingReadModel'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/telegram-bindings/{bindingId}/revoke:
    post:
      tags:
        - Telegram
      operationId: revokeTelegramBinding
      summary: Revoke a Telegram customer binding
      parameters:
        - name: bindingId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramBindingRevokeRequest'
      responses:
        '200':
          description: Telegram binding revoked and audited.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramBindingReadModel'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/telegram-binding-challenges:
    get:
      tags:
        - Telegram
      operationId: listTelegramBindingChallenges
      summary: List Telegram binding challenges
      responses:
        '200':
          description: Binding challenges without raw challenge codes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TelegramBindingChallenge'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - Telegram
      operationId: createTelegramBindingChallenge
      summary: Create a one-time Telegram binding challenge
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramBindingChallengeCreateRequest'
      responses:
        '201':
          description: Binding challenge created. The raw code is returned once in this response and is not stored in read models.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramBindingChallengeCreateResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/telegram-notification-policies:
    get:
      tags:
        - Telegram
      operationId: listTelegramNotificationPolicies
      summary: List Telegram notification policies
      responses:
        '200':
          description: Telegram notification policies.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TelegramNotificationPolicy'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/telegram-notification-policies/{policyId}:
    patch:
      tags:
        - Telegram
      operationId: updateTelegramNotificationPolicy
      summary: Update a Telegram notification policy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/OperatorGroupId'
        - $ref: '#/components/parameters/ResourceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramNotificationPolicyUpdateRequest'
      responses:
